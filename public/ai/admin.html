<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#090b14">
  <title>Quản trị · Locly AI</title>
  <link rel="stylesheet" href="/assets/ai/style.css">
  <link rel="stylesheet" href="/assets/ai/admin.css">
  <script src="/assets/ai/admin.js" defer></script>
</head>
<body class="admin-body">
  <div class="page-glow glow-one" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/ai/admin"><i>✦</i>locly<span>.ai</span><small>ADMIN</small></a>
    <nav><a href="/ai">Trang AI</a><a href="/xin-tien/admin">Đổi trà sữa</a><a href="/party/admin">Party</a></nav>
    <div class="admin-actions"><label><input id="sound" type="checkbox"><span>Âm báo</span></label><button id="logout" type="button">Đăng xuất</button></div>
  </header>

  <main class="admin-main">
    <section class="admin-summary">
      <div><span>TRUNG TÂM HỖ TRỢ</span><h1>Cuộc trò chuyện</h1><p id="admin-status">Đang tải danh sách…</p></div>
      <div class="active-stat"><small>ĐANG HOẠT ĐỘNG</small><strong id="active-count">0 / 3</strong></div>
    </section>

    <section class="admin-layout">
      <aside class="admin-sidebar"><header><span>PHIÊN GẦN ĐÂY</span><small>Chọn một phiên để trả lời</small></header><div id="admin-sessions" class="admin-sessions"></div></aside>
      <article class="conversation admin-conversation">
        <header><div class="avatar"><span>✦</span>AI</div><div><strong id="admin-session-title">Chọn một phiên</strong><span id="admin-session-state"><i></i>Tin nhắn được giữ 7 ngày</span></div><time id="admin-timer">—</time></header>
        <div id="admin-messages" class="messages"><div class="empty"><span>↖</span><b>Chưa chọn cuộc trò chuyện</b><p>Chọn một phiên ở danh sách bên trái để xem và trả lời.</p></div></div>
        <form id="admin-form" class="composer"><div id="admin-previews" class="previews" hidden></div><div class="compose-row"><label class="attach" aria-label="Đính kèm ảnh"><input id="admin-images" type="file" accept="image/jpeg,image/png,image/webp" multiple><span>＋</span></label><textarea id="admin-text" maxlength="4000" rows="1" placeholder="Nhập câu trả lời…" disabled></textarea><button id="admin-send" disabled><span>Gửi</span><i>↑</i></button></div></form><p id="admin-error" class="error"></p>
      </article>
    </section>
  </main>
  <dialog id="image-lightbox" class="image-lightbox"><button id="image-lightbox-close" class="lightbox-close" type="button" aria-label="Đóng ảnh">×</button><img id="image-lightbox-img" alt=""><p id="image-lightbox-caption"></p></dialog>
</body>
</html>
