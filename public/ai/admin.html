<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1020"><title>Quản trị trợ lý chat</title><link rel="stylesheet" href="/assets/ai/style.css"><link rel="stylesheet" href="/assets/ai/admin.css"><script src="/assets/ai/admin.js" defer></script></head>
<body class="admin-body">
  <header class="topbar"><a class="brand" href="/ai/admin">locly<span>.chat admin</span></a><nav><a href="/ai">Trang khách</a><a href="/xin-tien/admin">Đổi trà sữa</a></nav><div class="admin-actions"><label><input id="sound" type="checkbox"> Âm báo</label><button id="logout" type="button">Đăng xuất</button></div></header>
  <main class="admin-main"><section class="admin-summary"><div><span>ĐANG HOẠT ĐỘNG</span><strong id="active-count">0 / 3</strong></div><p id="admin-status">Đang tải danh sách…</p></section><section class="admin-layout"><aside id="admin-sessions" class="admin-sessions"></aside><article class="conversation admin-conversation"><header><div class="avatar">✦</div><div><strong id="admin-session-title">Chọn một phiên</strong><span id="admin-session-state">Tin nhắn được giữ 7 ngày</span></div><time id="admin-timer">—</time></header><div id="admin-messages" class="messages"><div class="empty">Chọn cuộc trò chuyện ở bên trái.</div></div><form id="admin-form" class="composer"><div id="admin-previews" class="previews" hidden></div><div class="compose-row"><label class="attach"><input id="admin-images" type="file" accept="image/jpeg,image/png,image/webp" multiple>＋</label><textarea id="admin-text" maxlength="4000" placeholder="Nhập câu trả lời…" disabled></textarea><button id="admin-send" disabled>Gửi</button></div></form><p id="admin-error" class="error"></p></article></section></main>
</body></html>
